# Construit l'APK Android sur les serveurs de GitHub (aucune installation locale nécessaire).
# Sur toutes les branches : analyse du code puis APK (téléchargeable dans l'onglet Actions).
# Sur main : l'APK est aussi publié dans la release « apk-latest » (lien direct pour la tablette).
name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Erreurs et avertissements bloquent ; les simples conseils de style non.
      - run: flutter analyze --no-fatal-infos

      # Clé de signature fixe (secrets du dépôt) : chaque APK s'installe par-dessus le précédent.
      - name: Clé de signature
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé de signature : APK signé avec une clé de test."
          fi

      # BUILD_SHA : version de l'APK, comparée à GitHub par « Mettre à jour » dans les Paramètres.
      # build-number : numéro de version qui augmente à chaque construction.
      - run: >
          flutter build apk --release --no-tree-shake-icons
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_SHA=${{ github.sha }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DensetsuReading.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DensetsuReading-apk
          path: DensetsuReading.apk

      - name: Publier dans la release apk-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (dernière version de main)
          body: "APK construit automatiquement depuis le commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: DensetsuReading.apk
