# Construit l'APK Android sur les serveurs de GitHub (aucune installation locale nécessaire).
# Sur toutes les branches : analyse du code puis APK (téléchargeable dans l'onglet Actions).
# Sur main : l'APK est aussi publié dans la release « apk-latest » (lien direct pour la tablette).
name: APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Erreurs et avertissements bloquent ; les simples conseils de style non.
      - run: flutter analyze --no-fatal-infos

      # Identifiants publics des clients AniList (variables du dépôt, facultatives).
      # Signé avec la clé de debug (suffisant pour installer sur sa propre tablette).
      - run: >
          flutter build apk --release --no-tree-shake-icons
          --dart-define=ANILIST_APP_ID=${{ vars.ANILIST_APP_ID }}
          --dart-define=BUILD_SHA=${{ github.sha }}

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DensetsuReading.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DensetsuReading-apk
          path: DensetsuReading.apk

      - name: Publier dans la release apk-latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (dernière version de main)
          body: "APK construit automatiquement depuis le commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: DensetsuReading.apk
