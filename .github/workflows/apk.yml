# Construit l'APK Android sur les serveurs de GitHub (aucune installation locale nécessaire).
# Le fichier est publié dans la release « apk-latest » : lien direct à ouvrir depuis la tablette.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Signé avec la clé de debug (suffisant pour installer sur sa propre tablette).
      - run: flutter build apk --release --no-tree-shake-icons

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk DensetsuReading.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DensetsuReading-apk
          path: DensetsuReading.apk

      - name: Publier dans la release apk-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (dernière version de main)
          body: "APK construit automatiquement depuis le commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: DensetsuReading.apk
